name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax & Compilation
        run: |
          python -m py_compile stadium_mapper.py stadium_scanner.py map_generator.py web_research.py team_matcher.py team_pdf_parser.py audio_player.py config.py validator.py

      - name: Verify CLI Interface
        run: |
          python stadium_mapper.py --no-gui --help

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm "Pes stadium mapper.spec"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pes-Stadium-Mapper-Windows
          path: dist/*.exe
